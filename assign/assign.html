<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assign company domains</title>
  <link rel="stylesheet" href="../options/options.css" />
  <link rel="stylesheet" href="assign.css" />
</head>
<body>
  <form id="form">
    <h2>Assign company domains</h2>
    <p id="subject" class="hint subject"></p>

    <ul id="chips" class="chips"></ul>

    <div class="field">
      <span id="preview" class="preview" aria-hidden="true"></span>
      <input id="domain" type="text" list="suggestions" placeholder="company.com"
             spellcheck="false" autocomplete="off" autofocus />
      <datalist id="suggestions"></datalist>
      <button id="add" type="button">Add</button>
    </div>
    <p class="hint">
      Press Enter to add, Enter again on an empty field to save.
      <span id="kindHint"></span>
    </p>

    <div class="buttons">
      <button id="cancel" type="button">Cancel</button>
      <button type="submit">Save</button>
    </div>
  </form>

  <script src="../settings.js"></script>
  <script src="assign.js"></script>
</body>
</html>
