name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(jq -r .version manifest.json)
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $v"; exit 1
          fi

      - name: Build XPI
        run: |
          v=$(jq -r .version manifest.json)
          mkdir -p dist
          zip -X -r "dist/conversation-favicons-$v.xpi" manifest.json settings.js background.js icon.svg api options assign consent LICENSE
          unzip -l "dist/conversation-favicons-$v.xpi"

      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: dist/*.xpi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.xpi --title "Conversation Favicons ${GITHUB_REF_NAME}" --generate-notes
